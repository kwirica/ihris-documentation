# Project information
site_name: 'iHRIS V5 Technical Documentation'
site_description: 'Technical documentation for iHRIS V5'
site_author: 'IntraHealth International'
site_url: 'https://github.com/iHRIS/ihris-documentation'

# Repository
repo_name: 'iHRIS'
repo_url: 'https://github.com/iHRIS/iHRIS'

# Copyright
copyright: 'Copyright &copy; 2025 IntraHealth International'

# Theme
theme:
  name: 'material'
  palette:
    #Light Mode
    primary: 'indigo'
    name: Light mode
    accent: 'blue'
    media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-4
   
   #Dark Mode
    primary: indigo
    accent: indigo
    media: "(prefers-color-scheme: dark)"
    name: Dark mode   
    scheme: slate
    toggle:
      icon: material/brightness-7
    primary: indigo
    accent: indigo  
  language: 'en'
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  features:
    - navigation.tabs
  # - navigation.expand

nav:
  - Home:
      - 'index.md'
  # - User:
  # - Implementer:
  - Developer:
      - dev/roadmap.md
      - dev/customization.md
      - dev/fhir_http.md
      - dev/roles_and_tasks.md
      - dev/short_name.md
      - dev/task_resolution.md
      - dev/todo.md
  - Sysadmin:
      - admin/ansible_installation.md
      - admin/docker.md
      - admin/manual_install.md
      - admin/config.md
  - User:
      - user/approach.md
      - user/introduction.md
      - user/people.md
      - user/positions.md
      - user/mhero.md
      - user/database.md
      - user/dashboard.md
      - user/locations.md
      - user/audit_logs.md
      - user/reports.md
      - user/system_users.md
      - user/ihris_apps.md
  - FAQs:
      - faq/faq.md
  - Video Tutorials:
      - video/video.md   
  - Blog:
      - blog/index.md
      - blog/posts/
          
     
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      toc_depth: '3'
  - footnotes

plugins:
  - rss:
      match_path: blog/posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      enabled: !ENV [CI, false]
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      comments_path: "#__comments"

# https://github.com/zhaoterryy/mkdocs-pdf-export-plugin not working
plugins:
  - search
  - blog
 #     blog_dir:.
    #  post_date_format: full
     # blog_toc: true
     # categories_toc: true
  - offline
  - tags
  - git-revision-date-localized
  - mkdocs-video
  # - mknotebooks
  # - pdf-export:
  #     combined: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iHRIS/iHRIS
# theme:
# logo: 'images/logo.png' must be 128x128
# logo:
#   icon: 'menu_book'
extra:
  analytics:
    provider: google
    property: G-2L7XFBJB3W

extra:
  analytics: 
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve this page by
            using our <a href="..." target="_blank" rel="noopener">feedback form</a>.